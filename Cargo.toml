[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ministep-core = { path = "crates/ministep-core" }
ministep-midi = { path = "crates/ministep-midi" }
ministep-remote = { path = "crates/ministep-remote" }
ministep-minilab = { path = "crates/ministep-minilab" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
parking_lot = "0.12"
crossbeam-channel = "0.5"
thiserror = "2"
midir = "0.11"
eframe = "0.37"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
dirs = "6"
mach2 = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
